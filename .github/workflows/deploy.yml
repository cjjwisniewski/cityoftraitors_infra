name: Deploy Terraform Infrastructure

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      module:
        description: 'Target Terraform module directory (all, or a single directory)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - resource_group
          - backend
          - storage
          - cloudflare
          - app_registrations
      apply:
        description: 'Apply changes (if false, runs plan only)'
        required: false
        default: false
        type: boolean
      untaint_address:
        description: 'Optional resource address to untaint before planning (requires single module)'
        required: false
        default: ''
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: cityoftraitors-infra-terraform
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest
    env:
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: 'true'
      TF_IN_AUTOMATION: 'true'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.9.0'
          terraform_wrapper: false

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Backend Storage Access Key
        run: |
          BACKEND_KEY=$(az storage account keys list \
            --resource-group "cityoftraitorscom" \
            --account-name "cityoftraitorsinfra" \
            --query "[0].value" \
            --output tsv 2>/dev/null || true)
          if [ -n "$BACKEND_KEY" ]; then
            echo "::add-mask::$BACKEND_KEY"
            echo "ARM_ACCESS_KEY=$BACKEND_KEY" >> "$GITHUB_ENV"
          fi

      - name: Validate Required Credentials
        run: |
          TARGET_MODULE="${{ github.event.inputs.module || 'all' }}"
          if { [ "$TARGET_MODULE" = "all" ] || [ "$TARGET_MODULE" = "cloudflare" ]; } && [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty. Set secrets.CLOUDFLARE_API_TOKEN in the repository or production environment."
            exit 1
          fi

      - name: Terraform Init, Validate, Plan & Apply
        env:
          TARGET_MODULE: ${{ github.event.inputs.module || 'all' }}
          DO_APPLY: ${{ github.event.inputs.apply || 'false' }}
          UNTAINT_ADDRESS: ${{ github.event.inputs.untaint_address || '' }}
        run: |
          set -euo pipefail

          if [ "$TARGET_MODULE" = "all" ]; then
            MODULES=(resource_group backend storage cloudflare app_registrations)
          else
            MODULES=("$TARGET_MODULE")
          fi

          if [ -n "$UNTAINT_ADDRESS" ] && [ "${#MODULES[@]}" -ne 1 ]; then
            echo "::error::untaint_address requires selecting a single target module."
            exit 1
          fi

          for mod in "${MODULES[@]}"; do
            echo "=== Module: $mod ==="
            pushd "$mod" >/dev/null
            terraform init -input=false
            terraform validate

            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$UNTAINT_ADDRESS" ]; then
              echo "Untainting resource in $mod: $UNTAINT_ADDRESS"
              terraform untaint "$UNTAINT_ADDRESS"
            fi

            terraform plan -input=false -out=tfplan

            DESTROY_COUNT=$(terraform show -json tfplan | jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length')
            if [ "$DESTROY_COUNT" -gt 0 ]; then
              echo "::error::[$mod] Plan includes $DESTROY_COUNT resource deletion(s)/replacement(s)! Aborting to protect stateful resources."
              terraform show tfplan
              rm -f tfplan
              exit 1
            fi

            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$DO_APPLY" = "true" ]; then
              echo "[$mod] Applying safe (non-destructive) plan..."
              terraform apply -input=false -auto-approve tfplan
            else
              echo "[$mod] Plan complete (auto-apply disabled on push; use workflow_dispatch with apply=true to apply)."
            fi
            rm -f tfplan
            popd >/dev/null
          done

      - name: Azure Logout
        if: always()
        run: az logout || true
